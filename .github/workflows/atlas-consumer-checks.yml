name: ATLAS consumer checks

on:
  push:
    branches:
      - 'release/**'
      - 'design/**'
  pull_request:
    branches:
      - 'release/**'
      - 'fix/**'
      - 'design/**'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:knowledge
      - run: npm run test:insurance-os
      - run: npm run test:financial
      - run: npm run test:intelligence
      - run: npm run test:staging-safety
      - run: npm run verify:migrations
      # Audit runtime dependencies separately from developer tooling.
      - run: npm audit --omit=dev --audit-level=high
