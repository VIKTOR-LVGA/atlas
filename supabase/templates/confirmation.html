<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Conferma il tuo account ATLAS</title>
  </head>
  <body style="margin:0;background:#f1f5f9;color:#0f172a;font-family:Inter,Arial,sans-serif;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f1f5f9;padding:24px 12px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:560px;background:#ffffff;border:1px solid #e2e8f0;border-radius:16px;overflow:hidden;">
            <tr>
              <td style="padding:28px 28px 12px;font-size:24px;font-weight:800;letter-spacing:-0.5px;color:#4f46e5;">ATLAS</td>
            </tr>
            <tr>
              <td style="padding:8px 28px 28px;">
                <h1 style="margin:0 0 12px;font-size:24px;line-height:1.25;">Conferma il tuo account</h1>
                <p style="margin:0 0 24px;color:#475569;font-size:16px;line-height:1.6;">Conferma il tuo indirizzo email per completare la creazione dell’account ATLAS.</p>
                <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#4f46e5;color:#ffffff;text-decoration:none;font-size:16px;font-weight:700;line-height:1;padding:14px 20px;border-radius:10px;">Conferma account</a>
                <p style="margin:24px 0 0;color:#64748b;font-size:13px;line-height:1.55;">Se non hai creato tu questo account, ignora questa email.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
