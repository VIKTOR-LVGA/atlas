# Remote-safe project configuration. Keep this file intentionally minimal:
# `supabase config push` changes only properties declared here.
project_id = "atlas"

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/**",
  "http://localhost:3001/**",
  "http://127.0.0.1:3000/**",
  "http://127.0.0.1:3001/**",
]
minimum_password_length = 8
